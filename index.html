<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bắt Sao</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell">
    <header><p class="eyebrow">MINI GAME · NGUYÊN THỦ</p><h1>Bắt Sao</h1><p class="instructions">Nguyên Thủ, hãy di chuyển giỏ để hứng những ngôi sao đang rơi.</p></header>
    <section class="scoreboard" aria-label="Điểm số"><div><span>Điểm</span><strong id="score">0</strong></div><div><span>Thời gian</span><strong id="time">60</strong></div><div><span>Kỷ lục</span><strong id="best">0</strong></div></section>
    <div id="game-area" class="game-area" tabindex="0" aria-label="Khu vực trò chơi"><div class="moon"></div><div id="basket" class="basket" aria-hidden="true">🧺</div><div id="overlay" class="overlay"><h2>Sẵn sàng chưa?</h2><p>Dùng phím <b>← →</b>, <b>A D</b> hoặc rê chuột để di chuyển.</p><button id="start-button">Bắt đầu chơi</button></div></div>
    <p class="hint">Mỗi ngôi sao hứng được: <b>+1 điểm</b></p>
  </main>
  <script src="script.js"></script>
</body>
</html>
